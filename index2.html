<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rin’s Touring Hub (Leaflet版)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f0f2f5; }
        header { background: #1a202c; color: white; padding: 15px 20px; }
        .header-content { display: flex; align-items: center; gap: 15px; max-width: 1200px; margin: 0 auto; }
        .header-logo { height: 50px; border-radius: 4px; }
        main { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .map-section { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; }
        #map { width: 100%; height: 65vh; }
        .popup-btn { display: inline-block; margin-top: 10px; padding: 8px 12px; background: #4285F4; color: white !important; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 0.85rem; }
        /* その他デザインは以前のものを継承 */
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <img src="logo.jpg" alt="Logo" class="header-logo">
        <h1>Rin’s Touring Hub</h1>
    </div>
</header>

<main>
    <div class="map-section">
        <div id="map"></div>
    </div>
    </main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([35.6895, 139.6917], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    fetch('locations.geojson')
        .then(res => res.json())
        .then(data => {
            L.geoJSON(data, {
                pointToLayer: function (feature, latlng) {
                    // --- uMapの色情報を探す (優先順位をつけてチェック) ---
                    let color = "#3182ce"; // デフォルト（青）

                    if (feature.properties) {
                        // 1. properties.color 直下
                        if (feature.properties.color) {
                            color = feature.properties.color;
                        } 
                        // 2. properties._storage_options.color (uMapの標準的な隠し場所)
                        else if (feature.properties._storage_options && feature.properties._storage_options.color) {
                            color = feature.properties._storage_options.color;
                        }
                    }

                    return L.circleMarker(latlng, {
                        radius: 9,
                        fillColor: color,
                        color: "#fff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.9
                    });
                },
                onEachFeature: function (feature, layer) {
                    const coords = feature.geometry.coordinates;
                    const gmapUrl = `https://www.google.com/maps/dir/?api=1&destination=${coords[1]},${coords[0]}`;
                    
                    let name = feature.properties.name || "スポット";
                    let desc = feature.properties.description || "";
                    
                    let content = `<strong>${name}</strong><br><br>${desc.replace(/\n/g, '<br>')}`;
                    content += `<br><a href="${gmapUrl}" target="_blank" class="popup-btn">Googleマップでナビ</a>`;
                    
                    layer.bindPopup(content);
                }
            }).addTo(map);
        });
</script>
</body>
</html>
