<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ラジオ | Rin’s Touring Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=20261102-mobile-panels">
    <style>
    .hub-navigation a.hub-nav-link { display:flex; align-items:center; justify-content:center; gap:9px; padding:0 22px; border-bottom:3px solid transparent; color:#dae5dc; font-weight:600; min-height:48px; text-decoration:none; }
    .hub-navigation a.hub-nav-link[aria-current] { color:#fff; border-bottom-color:var(--hub-sand); background:rgba(255,255,255,.07); }
    @media (hover:hover) { .hub-navigation a.hub-nav-link:hover { background:#ffffff12; } }
    @media (max-width:767px), (pointer:coarse) and (max-width:1023px) {
        .hub-navigation a.hub-nav-link { flex:1; flex-direction:column; gap:5px; border:0; border-top:3px solid transparent; padding:6px 2px; color:var(--hub-muted); font-size:.7rem; min-height:0; }
        .hub-navigation a.hub-nav-link i { font-size:1.1rem; }
        .hub-navigation a.hub-nav-link[aria-current] { border-top-color:var(--hub-sand); color:var(--hub-ink); background:#f2f2e9; }
    }
    .radio-wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 40px; color: var(--hub-ink); }
    .radio-wrap h2 { font-size: 1.3rem; margin: 0 0 8px; }
    .radio-intro { color: var(--hub-muted); font-size: .9rem; line-height: 1.7; margin: 0 0 20px; }
    .radio-player { position: sticky; top: 12px; z-index: 50; background: #fffefb; border: 1px solid var(--hub-line); border-top: 3px solid var(--hub-sand); border-radius: 10px; padding: 14px 16px; box-shadow: 0 4px 18px #183b3214; margin-bottom: 20px; }
    .radio-now { font-weight: 600; font-size: .95rem; margin: 0 0 10px; min-height: 1.4em; }
    .radio-now .radio-now-label { color: var(--hub-muted); font-weight: 400; font-size: .78rem; margin-right: 8px; }
    .radio-player audio { width: 100%; }
    .radio-controls { display: flex; gap: 10px; margin-top: 10px; }
    .radio-controls button { flex: 1; min-height: 44px; border: 1px solid var(--hub-line); border-radius: 8px; background: var(--hub-paper); color: var(--hub-ink); font-size: .9rem; cursor: pointer; }
    .radio-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    .radio-item { border: 1px solid var(--hub-line); border-radius: 10px; padding: 14px 16px; background: #fff; cursor: pointer; }
    .radio-item.active { border-color: var(--hub-sand); background: #f7f3e8; }
    .radio-item-head { display: flex; align-items: baseline; gap: 10px; }
    .radio-item-title { font-weight: 600; font-size: 1rem; }
    .radio-item-meta { color: var(--hub-muted); font-size: .78rem; white-space: nowrap; }
    .radio-item-summary { color: var(--hub-muted); font-size: .86rem; line-height: 1.7; margin: 6px 0 0; }
    .radio-item-links { margin-top: 8px; font-size: .82rem; }
    .radio-item-links a { color: var(--hub-accent); }
    .radio-note { color: var(--hub-muted); font-size: .8rem; line-height: 1.7; margin-top: 22px; }
    .radio-note a { color: var(--hub-accent); }
    @media (max-width:767px), (pointer:coarse) and (max-width:1023px) {
        .radio-wrap { padding-bottom: calc(var(--hub-nav-height) + env(safe-area-inset-bottom, 0px) + 24px); }
    }
    </style>
</head>
<body class="hub-site">
<header class="hub-header">
    <div class="header-content">
        <img src="./images/logo.jpg" alt="Logo" class="header-logo">
        <h1>Rin’s Touring Hub</h1>
        <nav class="hub-navigation" aria-label="メインナビゲーション">
            <a class="hub-nav-link" href="./"><i class="fa-solid fa-map" aria-hidden="true"></i><span>地図</span></a>
            <a class="hub-nav-link" href="radio.html" aria-current="page"><i class="fa-solid fa-radio" aria-hidden="true"></i><span>ラジオ</span></a>
        </nav>
    </div>
</header>
<main>
    <div class="radio-wrap">
        <h2>ラジオ</h2>
        <p class="radio-intro">バイクと道にまつわるコラム対談です。エピソードを選ぶと再生が始まり、終わると自動で次へ進むので、続けて聞けます。</p>

        <div class="radio-player">
            <p class="radio-now"><span class="radio-now-label">再生中</span><span id="now-title">未選択</span></p>
            <audio id="player" controls preload="none"></audio>
            <div class="radio-controls">
                <button type="button" id="btn-prev"><i class="fa-solid fa-backward-step" aria-hidden="true"></i> 前へ</button>
                <button type="button" id="btn-next">次へ <i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
            </div>
        </div>

        <ol class="radio-list" id="episode-list"></ol>

        <p class="radio-note">
            過去の放送は <a href="https://github.com/rinsan1120/radio-columns/releases" target="_blank" rel="noopener noreferrer">GitHub Releases</a> にも置いています。<br>
            音声：COEIROINK／アメノちゃん・つくよみちゃん
        </p>
    </div>
</main>
<footer class="site-footer">
    <div class="footer-credit">
        <span>© 2026 Created by rinsan1120</span>
        <a href="https://x.com/rinsan11201" target="_blank" class="footer-social">
            <i class="fa-brands fa-x-twitter"></i>
        </a>
    </div>
</footer>
<script>
    // 放送データ。新しい放送はこの配列の先頭に追加する。
    const RELEASE_BASE = 'https://github.com/rinsan1120/radio-columns/releases/download/2026-11-06/';
    const episodes = [
        {
            title: '水平対向はなぜ100年生き残れたのか',
            genre: 'バイク', duration: '3分40秒',
            file: '2026-11-06-column-01-boxer.mp3',
            script: '2026-11-06-column-01-boxer-script.md',
            summary: '生産撤退の窮地を救ったのは、パリダカの活躍とファンの購買運動だった。BMWボクサー100年の物語。'
        },
        {
            title: 'ビーナスラインという道の物語',
            genre: '旅の読み物', duration: '4分10秒',
            file: '2026-11-06-column-02-venusline.mp3',
            script: '2026-11-06-column-02-venusline-script.md',
            summary: '茅野から美ヶ原へ、全長75.2kmの高原道路。名前の由来と4つのエリアの見どころを辿る。'
        },
        {
            title: 'Museの活用事例、みんな何に使っている？',
            genre: 'AI・Muse', duration: '3分41秒',
            file: '2026-11-06-column-03-muse.mp3',
            script: '2026-11-06-column-03-muse-script.md',
            summary: 'Xで話題の活用法30選から、頼み方のコツと使うときの注意点まで。'
        }
    ];

    const player = document.getElementById('player');
    const nowTitle = document.getElementById('now-title');
    const listEl = document.getElementById('episode-list');
    let current = -1;

    episodes.forEach((ep, i) => {
        const li = document.createElement('li');
        li.className = 'radio-item';
        li.setAttribute('role', 'button');
        li.setAttribute('tabindex', '0');
        li.innerHTML =
            '<div class="radio-item-head"><span class="radio-item-title"></span>' +
            '<span class="radio-item-meta">' + ep.genre + ' ・ ' + ep.duration + '</span></div>' +
            '<p class="radio-item-summary"></p>' +
            '<div class="radio-item-links"><a class="radio-script-link" target="_blank" rel="noopener noreferrer">台本を読む</a></div>';
        li.querySelector('.radio-item-title').textContent = ep.title;
        li.querySelector('.radio-item-summary').textContent = ep.summary;
        const link = li.querySelector('.radio-script-link');
        link.href = RELEASE_BASE + ep.script;
        link.addEventListener('click', (e) => e.stopPropagation());
        li.addEventListener('click', () => playAt(i));
        li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playAt(i); } });
        listEl.appendChild(li);
    });

    function playAt(i) {
        if (i < 0 || i >= episodes.length) return;
        current = i;
        const ep = episodes[i];
        player.src = RELEASE_BASE + ep.file;
        player.play();
        nowTitle.textContent = ep.title;
        document.querySelectorAll('.radio-item').forEach((el, j) => {
            el.classList.toggle('active', j === i);
        });
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: ep.title,
                artist: 'Rin’s Touring Hub ラジオ',
                album: 'コラム対談'
            });
        }
    }

    document.getElementById('btn-prev').addEventListener('click', () => playAt(current - 1));
    document.getElementById('btn-next').addEventListener('click', () => playAt(current + 1));
    player.addEventListener('ended', () => {
        if (current >= 0 && current < episodes.length - 1) playAt(current + 1);
    });
    if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('previoustrack', () => playAt(current - 1));
        navigator.mediaSession.setActionHandler('nexttrack', () => playAt(current + 1));
    }
</script>

</body>
</html>
