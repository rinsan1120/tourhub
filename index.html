<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rin’s Touring Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css?t=20260527">
    
</head>
<body>
<header>
    <div class="header-content">
        <img src="./images/logo.jpg" alt="Logo" class="header-logo">
        <h1>Rin’s Touring Hub</h1>
        <i class="fa-solid fa-bars" onclick="toggleDrawer()" style="font-size: 1.5rem; cursor: pointer; padding: 5px;"></i>
    </div>
</header>
<!-- ▼追加：ドロワー要素▼ -->
<div id="drawer-overlay" class="drawer-overlay" onclick="toggleDrawer()"></div>
<div id="drawer-menu" class="drawer-menu">
    <div class="drawer-close" onclick="toggleDrawer()"><i class="fa-solid fa-xmark"></i></div>
    <div id="drawer-content">読み込み中...</div>
</div>
<!-- ▲追加ここまで▲ -->
<main>
    <div class="map-container">
        <div class="map-section">
                <div id="map-wrapper" style="position: relative;">
                <div id="map"></div>
                <button class="fullscreen-btn" onclick="toggleFullScreen()">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
            <div id="stats-badge">読み込み中...</div>
            <div id="operation-guide" style="position: absolute; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem;">
                <i class="fa-solid fa-circle-info"></i> <span id="guide-text">読み込み中...</span>
            </div>
            <button class="loc-btn" onclick="goToMyLocation()"><i class="fa-solid fa-crosshairs"></i></button>
        </div>
        <div id="legend" class="legend"><div class="legend-title">表示レイヤー切り替え</div><div id="legend-items"></div></div>
    </div>
    <div style="margin: 15px 10px; text-align: center;">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdehrB_duWjjHXZBbfdP06jWxHQDwBeP20cQBR3OMX3DVtLZw/viewform?usp=sharing&ouid=106460317115165638365" 
           target="_blank" 
           style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 16px; background: #ffffff; color: #4a5568 !important; border: 1px solid #cbd5e1; text-decoration: none; border-radius: 20px; font-size: 0.8rem; font-weight: normal; box-shadow: 0 1px 2px rgba(0,0,0,0.05); touch-action: manipulation;">
            <i class="fa-solid fa-location-dot" style="color: #718096;"></i> 地図へのスポット追加のご協力をお願いします（Googleフォーム）
        </a>
    </div>
    <div class="content-card">
        <div class="weather-card-header collapsed" onclick="toggleWeather()">
            <h2>全国エリア別天気（3日間）</h2>
            <i class="fa-solid fa-chevron-down toggle-icon"></i>
        </div>
        <div class="weather-collapsible-content">
            <div class="refresh-area"><span style="font-size:0.7rem; color:#666;">※予報が表示されない場合は</span><button id="refresh-weather-btn" onclick="refreshCurrentTabWeather()"><i class="fa-solid fa-sync"></i> 再取得</button></div>
            <div id="weather-tabs-container" class="weather-tabs"></div>
            <div class="weather-table-container">
                <div id="weather-header-row" class="weather-header"></div>
                <div id="weather-panels-container"></div>
            </div>
        </div>
    </div>

    <div class="tool-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
        <div class="content-card">
            <h2>周辺施設検索</h2>
            <div id="nearby-container" class="nearby-grid">読み込み中...</div>
        </div>
        <div class="content-card">
            <h2>地名で天気検索</h2>
            <input type="text" id="weather-input" placeholder="例：阿蘇山" style="width:100%; padding:12px; margin-bottom:8px; border-radius:8px; border:2px solid #cbd5e1; box-sizing:border-box;">
            <button class="btn-full" onclick="searchWeather()" style="background: #edf2f7; color: #4a5568; border: 1px solid #cbd5e1;">天気を検索</button>        </div>
    </div>

    <div class="content-card">
        <h2>旅の計画</h2>
        <div id="category-container">読み込み中...</div>
    </div>

    <div class="content-card"><h2>Update Log</h2><ul id="dynamic-update-list" class="update-list"></ul></div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script src="conf/map-engine.js"></script>
<script src="conf/michi-no-eki.js"></script>
<script src="conf/weather-engine.js"></script>

<script>
    // ヘルパー関数（nearbyやlinkでも使うため維持）
    function cleanLine(line) { 
    // URLの「://」を切断しないよう保護してから、コメントの「//」だけを消す
    return line.replace(/:\/\//g, '___URL___').split('//')[0].replace(/___URL___/g, '://').trim(); 
    }

    // 周辺検索の読み込み
    async function loadNearbyConfig() {
        const container = document.getElementById('nearby-container');
        try {
            const res = await fetch('conf/nearby.txt?t=' + Date.now()), text = await res.text();
            container.innerHTML = '';
            text.split('\n').forEach(rawLine => {
                const line = cleanLine(rawLine);
                if(!line) return;
                const parts = line.split(',');
                if (parts.length >= 3) {
                    const label = parts[0].trim(), keyword = parts[1].trim(), icon = parts[2].trim();
                    const a = document.createElement('a');
                    a.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(keyword)}`; 
                    a.className = 'btn-nearby'; a.target = '_blank';
                    a.innerHTML = `<i class="fa-solid ${icon}"></i> ${label}`;
                    container.appendChild(a);
                }
            });
        } catch (e) { container.innerHTML = 'nearby.txt 読込失敗'; }
    }

    // リンク集の読み込み
    async function loadLinks() {
        const container = document.getElementById('category-container');
        try {
            const res = await fetch('conf/link.txt?t=' + Date.now()), text = await res.text();
            container.innerHTML = ''; let currentGrid = null;
            text.split('\n').forEach(rawLine => {
                const line = cleanLine(rawLine);
                if(!line) return;
                if(line.startsWith('※')) {
                    const catDiv = document.createElement('div'); catDiv.className = 'link-category';
                    catDiv.innerHTML = `<h3><i class="fa-solid fa-chevron-right" style="font-size:0.8rem; margin-right:5px;"></i>${line.substring(1)}</h3>`;
                    currentGrid = document.createElement('div'); currentGrid.className = 'link-grid';
                    catDiv.appendChild(currentGrid); container.appendChild(catDiv);
                } else if(line.includes(',') && currentGrid) {
                    const firstCommaIdx = line.indexOf(',');
                    const n = line.substring(0, firstCommaIdx).trim();
                    // URLの末尾にある目に見えない改行やゴミを完全に削ぎ落とす
                    const u = line.substring(firstCommaIdx + 1).replace(/[\r\n]/g, '').trim();
                    
                    const a = document.createElement('a');
                    a.href = u; 
                    a.className = 'link-card'; 
                    a.target = '_blank'; 
                    a.innerHTML = n; // ← innerText を innerHTML に変更
                    currentGrid.appendChild(a);
                }
            });
        } catch (e) { container.innerHTML = 'link.txt 読込失敗'; }
    }

    // 更新ログの読み込み
    async function loadUpdateLog() {
        try {
            const res = await fetch('conf/updates.txt?t=' + Date.now()), text = await res.text();
            const list = document.getElementById('dynamic-update-list'); list.innerHTML = '';
            text.trim().split('\n').reverse().forEach(rawLine => {
                const line = cleanLine(rawLine);
                if(!line) return;
                const p = line.split('|'); if(p.length === 2) {
                    const li = document.createElement('li'); li.innerHTML = `<span style="font-family:monospace; font-weight:bold; background:#e2e8f0; padding:2px 6px; border-radius:4px; margin-right:10px; font-size:0.8rem;">${p[0].trim()}</span><span>${p[1].trim()}</span>`;
                    list.appendChild(li);
                }
            });
        } catch (e) {}
    }
    function toggleDrawer() {
        document.getElementById('drawer-menu').classList.toggle('open');
        document.getElementById('drawer-overlay').classList.toggle('open');
    }
    async function loadDrawerLinks() {
        const container = document.getElementById('drawer-content');
        try {
            const res = await fetch('conf/drawer-links.txt?t=' + Date.now()), text = await res.text();
            container.innerHTML = '';
            text.split('\n').forEach(rawLine => {
                const line = cleanLine(rawLine);
                if(!line) return;
                if(line.startsWith('※')) {
                    const h3 = document.createElement('h3');
                    h3.style.cssText = "margin-top: 15px; margin-bottom: 10px; font-size: 1rem; border-left: 4px solid #3182ce; padding-left: 8px;";
                    h3.innerHTML = line.substring(1);
                    container.appendChild(h3);
                } else if(line.includes(',')) {
                    const firstCommaIdx = line.indexOf(',');
                    const n = line.substring(0, firstCommaIdx).trim();
                    const u = line.substring(firstCommaIdx + 1).replace(/[\r\n]/g, '').trim();
                    
                    const a = document.createElement('a');
                    a.href = u; a.className = 'drawer-link-card'; a.target = '_blank';
                    a.innerHTML = n;
                    container.appendChild(a);
                }
            });
        } catch (e) { container.innerHTML = 'drawer-links.txt 読込失敗'; }
    }
    // ▲追加ここまで▲

    // すべてを起動するメイン処理
    window.addEventListener('load', () => {
        // 1. 地図を初期化（土台を作ってからマーカーを呼ぶ）
        if (typeof initMap === 'function') {
            initMap();
        }
        
        // 2. 天気を読み込み
        if (typeof loadWeatherConfig === 'function') {
            loadWeatherConfig();
        }
        
        // 3. その他パーツを読み込み
        loadNearbyConfig();
        loadLinks();
        loadUpdateLog();
        loadDrawerLinks(); // ← 追加：ドロワーの読み込み
    });
</script>
